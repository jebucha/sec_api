# Container gateway configuration (mounted read-only at /config/gateway.yaml).
#
# The upstream key comes from the podman secret `vllm-key`
# (compose.yaml -> /run/secrets/vllm-key). If it is missing, the gateway
# fails at startup. See gateway.example.yaml for the full field reference.

listen:
  host: 0.0.0.0
  port: 8080

mode: monitor                 # monitor | enforce
uninspected_policy: flag
debug_verdicts: false
upstream_timeout_s: 120
max_buffer_bytes: 4194304
max_request_bytes: 8388608
excerpt_max_chars: 200
rules_dir: /rules
events:
  path: /var/log/llmgw/events.jsonl
  stdout: true
canary_tokens_env: LLMGW_CANARIES   # comma-separated canary values (D11)

upstreams:
  gpu-box:
    url: http://10.0.0.20:8000
    auth:
      style: bearer
      secret_file: /run/secrets/vllm-key
  mac-mini:
    url: http://10.0.0.21:1334
    auth:
      style: none

models:
  qwen3-32b: gpu-box
  llama-3.1-8b: mac-mini

clients:
  opencode-laptop:
    # Example hash of the placeholder token "change-me-gateway-token".
    # Generate your own with: uv run llmgw-token <client-name>
    token_sha256: a7f8302bc043fcd8b75a330082e7fc93ef7f39b2b10de9f761e6d42a33db2698
