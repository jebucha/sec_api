# Example gateway configuration.
#
# Tokens: `llmgw-token <client-name>` prints a random plaintext token once
# and its sha256. Put the sha256 in `clients` — never the plaintext.
# Upstream secrets come from environment variables (`secret_env`) or secret
# files (`secret_file`, e.g. podman secrets under /run/secrets/).
# If a referenced secret is missing, the gateway fails at startup.

listen:
  host: 0.0.0.0
  port: 8080

mode: monitor                 # monitor | enforce
uninspected_policy: flag      # flag | fail_closed
debug_verdicts: false
upstream_timeout_s: 120
max_buffer_bytes: 4194304     # 4 MiB streaming buffer cap
max_request_bytes: 8388608    # 8 MiB request body cap
excerpt_max_chars: 200
rules_dir: /rules
events:
  path: /var/log/llmgw/events.jsonl
  stdout: true
canary_tokens_env: LLMGW_CANARIES   # comma-separated canary values

upstreams:
  gpu-box:
    url: http://10.0.0.20:8000
    auth:
      style: bearer           # bearer | x-api-key | none
      secret_env: VLLM_KEY
  mac-mini:
    url: http://10.0.0.21:1234
    auth:
      style: none

models:
  qwen3-32b: gpu-box
  llama-3.1-8b: mac-mini

clients:
  opencode-laptop:
    # Example hash of the placeholder token "change-me-gateway-token".
    # Generate your own with: uv run llmgw-token <client-name>
    token_sha256: a7f8302bc043fcd8b75a330082e7fc93ef7f39b2b10de9f761e6d42a33db2698
